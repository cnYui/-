services:
  postgres:
    image: postgres:16
    container_name: mingri-postgres-5433
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mingri_lvtu
    ports:
      - "5433:5432"
    volumes:
      - mingri_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mingri_postgres_data:
    driver: local
