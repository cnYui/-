<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片上传测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .upload-form {
            border: 2px solid #333;
            padding: 20px;
            border-radius: 8px;
        }
        input[type="file"] {
            margin: 10px 0;
        }
        button {
            background: #FFD600;
            border: 3px solid #000;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
        }
        button:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border: 2px solid #333;
            background: #f0f0f0;
        }
        .preview {
            margin-top: 20px;
        }
        .preview img {
            max-width: 100%;
            border: 3px solid #000;
        }
    </style>
</head>
<body>
    <h1>图片上传测试</h1>
    
    <div class="upload-form">
        <h2>选择图片</h2>
        <input type="file" id="imageInput" accept="image/*">
        <br>
        <button onclick="uploadImage()">上传图片</button>
    </div>

    <div id="result" class="result" style="display:none;">
        <h3>上传结果</h3>
        <pre id="resultText"></pre>
    </div>

    <div id="preview" class="preview" style="display:none;">
        <h3>图片预览</h3>
        <img id="previewImage" src="" alt="上传的图片">
    </div>

    <script>
        async function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            const file = fileInput.files[0];

            if (!file) {
                alert('请先选择图片');
                return;
            }

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('http://localhost:3001/api/upload/image', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                // 显示结果
                document.getElementById('result').style.display = 'block';
                document.getElementById('resultText').textContent = JSON.stringify(result, null, 2);

                // 如果上传成功，显示预览
                if (result.success) {
                    const imageUrl = 'http://localhost:3001' + result.data.url;
                    document.getElementById('preview').style.display = 'block';
                    document.getElementById('previewImage').src = imageUrl;
                }
            } catch (error) {
                document.getElementById('result').style.display = 'block';
                document.getElementById('resultText').textContent = '上传失败: ' + error.message;
            }
        }
    </script>
</body>
</html>
