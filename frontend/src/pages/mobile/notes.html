<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>笔记 - Welcome to my house</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/common.css">
    <link rel="stylesheet" href="../../styles/image-editor.css">
    
    <style>
        :root {
            --accent-green: #00E676;
            --accent-yellow: #FFD600;
            --accent-orange: #FF5C00;
            --accent-blue: #2B59FF;
            --border-color: #000;
            --text-color: #000;
            --primary-bg: #f0f0f0;
            --border-width: 4px;
        }

        body {
            background-color: var(--primary-bg);
            padding-bottom: 70px;
            margin: 0;
            overflow-x: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
        }

        .notes-container {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 90px;
            box-sizing: border-box;
        }

        .search-container {
            margin-bottom: 25px;
            position: relative;
        }

        .search-input {
            width: 100%;
            height: 50px;
            background-color: #fff;
            border: 4px solid var(--border-color);
            border-radius: 25px;
            padding: 0 20px 0 50px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            box-sizing: border-box;
            box-shadow: 4px 4px 0 rgba(0,0,0,1);
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,1);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #666;
            pointer-events: none;
        }

        .note-card {
            background-color: #fff;
            border: 4px solid var(--border-color);
            box-shadow: 4px 4px 0 rgba(0,0,0,1);
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 15px;
        }

        .note-card:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,1);
        }

        .note-content {
            width: 100%;
        }

        .note-title {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .note-text {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #999;
        }

        .category-view-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .category-back-btn {
            border: 3px solid var(--border-color);
            background: #fff;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 3px 3px 0 rgba(0,0,0,1);
            cursor: pointer;
        }

        .category-back-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 rgba(0,0,0,1);
        }

        .category-name {
            font-size: 14px;
            font-weight: 900;
            color: var(--accent-blue);
        }

        .note-location {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #fff;
            border-top: var(--border-width) solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            font-weight: bold;
            font-size: 12px;
            height: 100%;
            transition: all 0.2s ease;
        }

        .nav-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--accent-blue);
        }

        .center-add-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .center-add-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--accent-yellow);
            border: 4px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            color: var(--text-color);
            text-decoration: none;
            box-shadow: 3px 3px 0 rgba(0,0,0,1);
            transition: all 0.2s ease;
            cursor: pointer;
            margin-bottom: 5px;
        }

        .center-add-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 rgba(0,0,0,1);
        }

        /* 悬浮发布菜单 - Neo Brutalism */
        .publish-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(2px);
        }

        .publish-modal-overlay.show {
            display: block;
            opacity: 1;
        }

        .publish-menu {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            background-color: var(--primary-bg);
            border-top: 6px solid var(--border-color);
            padding: 20px;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .publish-modal-overlay.show .publish-menu {
            bottom: 0;
        }

        .menu-btn {
            width: 100%;
            padding: 16px;
            background-color: #fff;
            border: 4px solid var(--border-color);
            box-shadow: 4px 4px 0 rgba(0,0,0,1);
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.1s ease;
        }

        .menu-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0,0,0,1);
        }

        .menu-btn.btn-photo { background-color: #FF69B4; color: white; }
        .menu-btn.btn-camera { background-color: var(--accent-blue); color: white; }
        .menu-btn.btn-text { background-color: var(--accent-yellow); color: black; }
        .menu-btn.btn-cancel { 
            background-color: #e0e0e0; 
            margin-top: 10px;
            border: 4px dashed var(--border-color);
            box-shadow: none;
        }
        
        .menu-btn.btn-cancel:active {
            transform: scale(0.98);
        }

        /* 写文字编辑弹窗样式 */
        .text-editor-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 90%;
            max-width: 500px;
            background-color: #f5f5f0;
            border: 6px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            opacity: 0;
        }

        .publish-modal-overlay.show .text-editor-card {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .editor-next-btn {
            background-color: #ff6b9d;
            color: #fff;
            border: none;
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .editor-content {
            position: relative;
        }

        .quote-icon {
            font-size: 80px;
            color: #e0e0e0;
            position: absolute;
            top: -20px;
            left: 10px;
            font-family: Georgia, serif;
        }

        .editor-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            margin-top: 40px;
            color: #333;
        }

        .editor-textarea {
            width: 100%;
            min-height: 200px;
            border: none;
            background-color: transparent;
            font-size: 16px;
            color: #666;
            resize: none;
            outline: none;
            font-family: 'AlibabaPuHuiTi', sans-serif;
        }

        .editor-textarea::placeholder {
            color: #ccc;
        }
    </style>
</head>
<body>
    <script type="module" src="/js/auth-check.js"></script>
    <div class="notes-container">
        <div class="search-container">
            <i class="ri-search-line search-icon"></i>
            <input type="text" class="search-input" placeholder="搜索信件...">
        </div>

        <!-- 邮件列表容器 -->
        <div id="mailsContainer">
            <div class="loading-state" style="text-align: center; padding: 40px;">
                <i class="ri-loader-4-line" style="font-size: 32px; animation: spin 1s linear infinite;"></i>
                <p>加载中...</p>
            </div>
        </div>
    </div>
    
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #fff;
            border: 4px solid var(--border-color);
            box-shadow: 6px 6px 0 rgba(0,0,0,1);
            border-radius: 12px;
        }
        
        .empty-state i {
            font-size: 64px;
            color: #ccc;
            margin-bottom: 16px;
        }
        
        .empty-state p {
            font-size: 16px;
            color: #666;
            margin: 8px 0;
        }
        
        .mail-type-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            margin-right: 8px;
        }
        
        .mail-type-diary { background: var(--accent-green); color: #000; }
        .mail-type-system { background: var(--accent-blue); color: #fff; }
        .mail-type-friend { background: var(--accent-orange); color: #fff; }
        .mail-type-ai { background: #9C27B0; color: #fff; }
        
        .unread-badge {
            width: 8px;
            height: 8px;
            background: #FF6B6B;
            border-radius: 50%;
            display: inline-block;
            margin-left: 8px;
        }
        
        .mail-image {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 3px solid var(--border-color);
        }
    </style>

    <div class="bottom-nav">
        <a href="/" class="nav-item">
            <span class="nav-icon"><i class="ri-map-pin-line"></i></span>
            <span class="nav-text">地图</span>
        </a>
        <a href="/pages/mobile/spark.html" class="nav-item">
            <span class="nav-icon"><i class="ri-sparkling-line"></i></span>
            <span class="nav-text">火花</span>
        </a>
        <div class="center-add-wrapper">
            <div class="center-add-btn" onclick="togglePublishMenu()">
                <i class="ri-add-line"></i>
            </div>
        </div>
        <a href="/pages/mobile/notes.html" class="nav-item active">
            <span class="nav-icon"><i class="ri-mail-line"></i></span>
            <span class="nav-text">收信箱</span>
        </a>
        <a href="/pages/mobile/profile.html" class="nav-item">
            <span class="nav-icon"><i class="ri-user-line"></i></span>
            <span class="nav-text">我的</span>
        </a>
    </div>

    <!-- 发布悬浮窗 -->
    <div class="publish-modal-overlay" id="publishModal">
        <div class="publish-menu">
            <div class="menu-btn btn-photo" onclick="selectFromGallery()">
                <i class="ri-image-line"></i> 从相册选择
            </div>
            <div class="menu-btn btn-camera" onclick="openCamera()">
                <i class="ri-camera-line"></i> 相机
            </div>
            <div class="menu-btn btn-text" onclick="openTextEditor()">
                <i class="ri-edit-box-line"></i> 写文字
            </div>
            <div class="menu-btn" style="background:#fff; color:#000;" onclick="openSavedRecordsPage()">
                <i class="ri-folder-open-line"></i> 查看记录
            </div>
            <div class="menu-btn btn-cancel" onclick="closePublishModal()">
                取消
            </div>
        </div>
    </div>

    <!-- 写文字编辑弹窗 -->
    <div class="publish-modal-overlay" id="textEditorModal" style="background-color: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);">
        <div class="text-editor-card">
            <div class="editor-header">
                <i class="ri-close-line" onclick="closeTextEditor()" style="font-size: 32px; cursor: pointer;"></i>
                <button class="editor-next-btn" onclick="submitTextNote()">下一步</button>
            </div>
            <div class="editor-content">
                <div class="quote-icon">"</div>
                <div class="editor-title">写想法</div>
                <textarea class="editor-textarea" id="textEditorInput" placeholder="说点什么或提个问题..."></textarea>
            </div>
        </div>
    </div>

    <input type="file" id="galleryInput" accept="image/*" style="display: none;" onchange="handleGallerySelect(event)">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="handleCameraCapture(event)">
    <input type="file" id="editorImageInput" accept="image/*" multiple style="display: none;" onchange="handleEditorImageSelect(event)">

    <!-- 图片编辑器悬浮卡片 -->
    <div class="publish-modal-overlay" id="imageEditorModal">
        <div class="image-editor-card">
            <div class="editor-header">
                <i class="ri-close-line" onclick="closeImageEditor()" style="font-size: 32px; cursor: pointer;"></i>
                <button class="editor-next-btn" onclick="publishImageNote()">发布</button>
            </div>
            
            <div class="editor-images-section" id="editorImagesSection">
                <!-- 图片将动态添加在这里 -->
            </div>
            
            <div class="editor-input-group">
                <label class="editor-input-label">添加标题</label>
                <input type="text" class="editor-input-field" placeholder="给你的笔记起个名字..." id="imageEditorTitle" required>
            </div>
            
            <div class="editor-input-group">
                <label class="editor-input-label">添加正文</label>
                <textarea class="editor-textarea-field" placeholder="分享你的故事..." id="imageEditorContent" required></textarea>
            </div>
            
            <div class="editor-input-group">
                <label class="editor-input-label">访问时间 <span style="color: #ff4444;">*</span></label>
                <input type="datetime-local" class="editor-input-field" id="imageEditorVisitTime" required>
            </div>
            
            <div class="editor-input-group">
                <label class="editor-input-label">心情 <span style="color: #ff4444;">*</span></label>
                <select class="editor-input-field" id="imageEditorMood" required>
                    <option value="">请选择心情...</option>
                    <option value="开心">😊 开心</option>
                    <option value="兴奋">🤩 兴奋</option>
                    <option value="平静">😌 平静</option>
                    <option value="感动">🥺 感动</option>
                    <option value="惊讶">😲 惊讶</option>
                    <option value="悲伤">😢 悲伤</option>
                    <option value="愤怒">😠 愤怒</option>
                    <option value="焦虑">😰 焦虑</option>
                    <option value="疲惫">😫 疲惫</option>
                    <option value="无聊">😑 无聊</option>
                    <option value="恐惧">😨 恐惧</option>
                    <option value="幸福">🥰 幸福</option>
                    <option value="孤独">😔 孤独</option>
                </select>
            </div>
            
            <div class="editor-input-group">
                <label class="editor-input-label">地理位置 <span style="color: #ff4444;">*</span></label>
                <input type="text" class="editor-input-field" placeholder="搜索或输入地点..." id="imageEditorLocation" required>
            </div>
            
            <div style="display:flex; gap:12px; margin-top:18px;">
                <button class="editor-publish-btn" onclick="saveDraftRecord()" style="flex:1; background:#fff; color:#000; font-size:14px; padding:14px 10px; white-space:nowrap; line-height:1.2;">
                    <i class="ri-save-3-fill"></i> 保存记录
                </button>
                <button class="editor-publish-btn" onclick="publishImageNote()" style="flex:1; margin-top:0; font-size:14px; padding:14px 10px; white-space:nowrap; line-height:1.2;">
                    <i class="ri-send-plane-fill"></i> 发布笔记
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="../../js/publish-modal.js"></script>
    <script type="module" src="../../js/notes-page.js"></script>
</body>
</html>
