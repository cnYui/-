<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>帖子详情 - 明日旅途</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
    <style>
        :root {
            --bg: #f4f5f8;
            --card: #ffffff;
            --text: #222;
            --muted: #6b7280;
            --border: #000;
            --accent: #4f46e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
        }

        .shell {
            max-width: 520px;
            margin: 0 auto;
            padding: 16px 14px 28px;
        }

        :root {
            --topbar-sticky-offset: 74px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 30;
            background: var(--bg);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .sticky-summary {
            position: sticky;
            top: var(--topbar-sticky-offset);
            z-index: 25;
            background: var(--bg);
            padding-bottom: 10px;
        }

        .detail-content {
            margin-top: 4px;
        }

        .back-btn {
            width: 42px;
            height: 42px;
            border: 3px solid var(--border);
            border-radius: 12px;
            background: #fff;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 3px 3px 0 var(--border);
            cursor: pointer;
        }

        .page-title {
            font-weight: 800;
            font-size: 18px;
        }

        .card {
            background: var(--card);
            border: 3px solid var(--border);
            border-radius: 18px;
            box-shadow: 4px 4px 0 var(--border);
            padding: 14px;
        }

        .post-title {
            font-size: 20px;
            line-height: 1.35;
            font-weight: 800;
            word-break: break-word;
        }

        .meta-grid {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #111;
            min-width: 0;
        }

        .meta-item i {
            font-size: 16px;
            color: var(--accent);
        }

        .meta-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .content-card {
            margin-top: 14px;
            background: #fff;
            border: 3px solid var(--border);
            border-radius: 16px;
            box-shadow: 4px 4px 0 var(--border);
            padding: 12px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .post-content {
            white-space: pre-wrap;
            line-height: 1.65;
            font-size: 14px;
            color: #222;
            word-break: break-word;
        }

        .gallery {
            margin-top: 14px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .img-wrap {
            border: 3px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            box-shadow: 3px 3px 0 var(--border);
            aspect-ratio: 1 / 1;
        }

        .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .state {
            margin-top: 18px;
            font-size: 14px;
            color: var(--muted);
            text-align: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <button class="back-btn" id="backBtn" aria-label="返回">
                <i class="ri-arrow-left-line"></i>
            </button>
            <h1 class="page-title">帖子详情</h1>
            <div style="width:42px;"></div>
        </header>

        <section id="detailRoot" class="hidden">
            <div class="sticky-summary">
                <article class="card">
                    <h2 class="post-title" id="postTitle"></h2>
                    <div class="meta-grid">
                        <div class="meta-item"><i class="ri-emotion-line"></i><span class="meta-text" id="postMood"></span></div>
                        <div class="meta-item"><i class="ri-map-pin-line"></i><span class="meta-text" id="postLocation"></span></div>
                        <div class="meta-item"><i class="ri-time-line"></i><span class="meta-text" id="postTime"></span></div>
                        <div class="meta-item"><i class="ri-user-3-line"></i><span class="meta-text" id="postAuthor"></span></div>
                    </div>
                </article>
            </div>

            <div class="detail-content">
                <section class="content-card">
                    <h3 class="section-title"><i class="ri-file-text-line"></i> 正文内容</h3>
                    <div id="postContent" class="post-content"></div>
                </section>

                <section class="content-card">
                    <h3 class="section-title"><i class="ri-image-line"></i> 图片内容</h3>
                    <div id="postGallery" class="gallery"></div>
                </section>
            </div>
        </section>

        <div id="loadingState" class="state">正在加载帖子详情...</div>
        <div id="errorState" class="state hidden"></div>
    </main>

    <script>
        const API_BASE = '/api';

        function getMoodEmoji(mood) {
            const map = {
                '开心': '😊',
                '兴奋': '🤩',
                '平静': '😌',
                '感动': '🥺',
                '惊讶': '😲',
                '悲伤': '😢',
                '愤怒': '😠',
                '焦虑': '😰',
                '疲惫': '😫',
                '无聊': '😑',
                '恐惧': '😨',
                '幸福': '🥰',
                '孤独': '😔'
            };
            return map[mood] || '😊';
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDateTime(value) {
            if (!value) return '未知时间';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return String(value);
            return date.toLocaleString('zh-CN', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function parseQueryPostId() {
            const url = new URL(window.location.href);
            return url.searchParams.get('id');
        }

        function showError(message) {
            document.getElementById('loadingState').classList.add('hidden');
            const errorNode = document.getElementById('errorState');
            errorNode.classList.remove('hidden');
            errorNode.textContent = message;
        }

        async function requestPostDetail(postId) {
            const endpoints = [
                `${API_BASE}/posts/detail/${encodeURIComponent(postId)}`,
                `${API_BASE}/posts/${encodeURIComponent(postId)}`
            ];

            for (const endpoint of endpoints) {
                let response;
                try {
                    response = await fetch(endpoint);
                } catch {
                    continue;
                }

                const text = await response.text();
                let result = null;
                try {
                    result = text ? JSON.parse(text) : null;
                } catch {
                    result = null;
                }

                if (response.ok && result?.success && result?.data) {
                    return result.data;
                }

                if (response.status !== 404) {
                    const detail = result?.error || `HTTP ${response.status}`;
                    throw new Error(detail);
                }
            }

            throw new Error('贴文不存在或后端接口不可用');
        }

        function renderPost(post) {
            document.getElementById('postTitle').textContent = post.title || post.locationName || '旅行记录';
            document.getElementById('postMood').textContent = `${getMoodEmoji(post.mood)} ${post.mood || '未设置'}`;
            document.getElementById('postLocation').textContent = [post.city, post.district, post.locationName].filter(Boolean).join(' · ') || '未知地点';
            document.getElementById('postTime').textContent = formatDateTime(post.createdAt);
            document.getElementById('postAuthor').textContent = post.nickname || post.username || '匿名旅行者';
            document.getElementById('postContent').innerHTML = escapeHtml(post.content || '（无正文内容）');

            const images = Array.isArray(post.imageUrls) && post.imageUrls.length
                ? post.imageUrls
                : (post.imageUrl ? [post.imageUrl] : []);

            const gallery = document.getElementById('postGallery');
            gallery.innerHTML = images.length
                ? images.map((url) => `<div class="img-wrap"><img src="${escapeHtml(url)}" alt="帖子图片"></div>`).join('')
                : '<div class="post-content">（无图片）</div>';

            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('detailRoot').classList.remove('hidden');
        }

        async function loadPostDetail() {
            const postId = parseQueryPostId();
            if (!postId) {
                showError('缺少帖子 ID');
                return;
            }

            try {
                const post = await requestPostDetail(postId);
                renderPost(post);
            } catch (error) {
                console.error('❌ 加载帖子详情失败:', error);
                showError(`加载失败：${error.message}`);
            }
        }

        document.getElementById('backBtn').addEventListener('click', () => {
            if (history.length > 1) {
                history.back();
            } else {
                window.location.href = '/';
            }
        });

        window.addEventListener('DOMContentLoaded', loadPostDetail);
    </script>
</body>
</html>
